name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Independent of the `ci` job below — no pnpm/Supabase needed, so it
  # doesn't block on or wait for them. Scans the full history on every run
  # (checkout with fetch-depth: 0), not just the current diff, so a secret
  # committed and later removed still fails the build rather than only
  # showing up in a one-time manual audit.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Installed directly from a pinned release rather than a marketplace
      # action, matching how supabase/setup-cli is version-pinned above —
      # no third-party action with its own update cadence or, for gitleaks
      # specifically, a licensing check against an external server.
      - name: Install gitleaks
        run: |
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          sha256sum --ignore-missing -c gitleaks_8.30.1_checksums.txt
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - run: gitleaks detect --source . --redact -v

  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The local stack's keys are the same fixed demo values on every machine,
      # so the example file is a working config rather than a template. Needed
      # before `pnpm test`, not just before the e2e suite: src/lib/supabase.ts
      # throws at import time if these are missing, which several Vitest
      # suites reach transitively (e.g. App.test.tsx via session queries).
      - run: cp apps/web/.env.example apps/web/.env.local

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - run: supabase start
      - run: supabase test db --local

      - run: pnpm --filter @vbs/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  # Off until the staging Supabase project exists and its secrets/variables
  # are set (docs/runbook.md) — flip the repo variable DEPLOY_ENABLED to
  # "true" then. Until it is, this job is skipped, not failed, since the
  # `if:` below is false.
  #
  # Promoting to production is a separate, manually-triggered workflow
  # (deploy-production.yml) rather than a job chained after this one — see
  # that file for why.
  #
  # Each environment's own vars/secrets (Settings → Environments → <env>)
  # resolve automatically from this job's `environment:` — no need to name
  # staging vs. production anywhere in the steps below.
  deploy-staging:
    needs: ci
    if: >
      github.ref == 'refs/heads/main' && github.event_name == 'push' &&
      vars.DEPLOY_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Apply database migrations
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF"
          supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Build
        run: pnpm build
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Deploy release and switch symlink
        run: |
          # $release/$RELEASE_PATH are built on the runner and meant to
          # expand client-side before reaching ssh, hence the disables below.
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts
          release="$RELEASE_PATH/releases/${{ github.sha }}"
          # shellcheck disable=SC2029
          ssh "$VPS_USER@$VPS_HOST" "mkdir -p '$release'"
          rsync -az --delete apps/web/dist/ "$VPS_USER@$VPS_HOST:$release/"
          # shellcheck disable=SC2029
          ssh "$VPS_USER@$VPS_HOST" "
            ln -sfn '$release' '$RELEASE_PATH/current' &&
            cd '$RELEASE_PATH/releases' &&
            ls -1t | tail -n +6 | xargs -r rm -rf
          "
        env:
          VPS_HOST: ${{ vars.VPS_HOST }}
          VPS_USER: ${{ vars.VPS_USER }}
          RELEASE_PATH: ${{ vars.RELEASE_PATH }}

      - run: pnpm --filter @vbs/web exec playwright install --with-deps chromium
      - name: Smoke test
        run: pnpm --filter @vbs/web test:smoke
        env:
          SMOKE_BASE_URL: ${{ vars.SITE_URL }}
          SMOKE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SMOKE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

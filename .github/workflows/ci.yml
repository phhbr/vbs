name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - run: supabase start
      - run: supabase test db --local

      # The local stack's keys are the same fixed demo values on every machine,
      # so the example file is a working config rather than a template.
      - run: cp apps/web/.env.example apps/web/.env.local

      - run: pnpm --filter @vbs/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
